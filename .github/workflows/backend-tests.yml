name: Backend tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: code_garden
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: code_garden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U code_garden -d code_garden_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://code_garden:ci-only-password@127.0.0.1:5432/code_garden_test
      TEST_DATABASE_URL: postgresql+psycopg://code_garden:ci-only-password@127.0.0.1:5432/code_garden_test
      JWT_SECRET: ci-only-jwt-secret-for-disposable-test-environment
      COOKIE_SECURE: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Apply migrations
        run: python -m alembic upgrade head
      - name: Run unit and PostgreSQL integration tests
        run: python -m pytest -q
      - name: Check migrations match models
        run: python -m alembic check
